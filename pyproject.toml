[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "projective"
version = "0.0.1"
authors = [
  { name="Ryuto Yoshida"},
]
description = "Utilities for projective geometry: epipolar constraints and 2D perspective transforms (affine / homography)."
readme = "src/projective/README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.26",
    "opencv-contrib-python>=4.5.1",
    "opencv-utility @ git+https://github.com/ry-yoshida-dev/OpenCVUtility.git",
    "typing-extensions>=4.4",
]

[project.urls]
"Homepage" = "https://github.com/ry-yoshida-dev/Projective"
"Bug Tracker" = "https://github.com/ry-yoshida-dev/Projective/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
projective = ["py.typed"]

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.mypy]
files = ["src", "tests"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
exclude-newer = "7 days"

[tool.basedpyright]
# PerspectiveMatrix.from_points and transform_type tie the matrix classes to
# PerspectiveTransformationMethod, which maps back to the concrete classes,
# so the package has import cycles by design.
reportImportCycles = false

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "D"]
# Only public classes, methods, and functions need docstrings, and multi-line ones are the local style.
ignore = ["E501", "D100", "D104", "D105", "D200"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
